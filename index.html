<!doctype html>

<style>
:root{--g:#0b3b2e;--g2:#14694d;--lime:#b6ef72;--bg:#f5f8f5;--ink:#12251f;--muted:#6c7f77;--line:#dfe9e4;--white:#fff;--hot:#a7530d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}a{text-decoration:none;color:inherit}h1,h2,h3,p{margin-top:0}.wrap{max-width:1400px;margin:auto;padding:0 5vw}.logo{font-weight:900;font-size:22px;display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--g),#239166);position:relative}.mark:before{content:"";position:absolute;left:8px;top:11px;width:16px;height:11px;border:3px solid #e7ffef;border-top:0;border-radius:2px 2px 7px 7px}.mark:after{content:"";position:absolute;width:8px;height:8px;background:var(--lime);border-radius:50%;right:5px;top:5px}.logo b{color:#1b9366}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800}.primary{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--g)}.soft{background:#eaf5ee;color:var(--g)}.pill{display:inline-block;background:#e9f5ed;color:#116246;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900}.hot{background:#fff0df;color:var(--hot)}.demo{background:#edf0ff;color:#4157a4}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8efeb;background:rgba(250,252,250,.92);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20;padding:0 5vw}.navlinks{display:flex;gap:22px;font-size:13px;font-weight:700;color:#587068}.navact{display:flex;gap:8px}.hero{padding:70px 5vw;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center;max-width:1500px;margin:auto}.hero h1{font-size:clamp(48px,6vw,82px);line-height:1;letter-spacing:-3px;margin:16px 0 20px}.grad{background:linear-gradient(105deg,var(--g),#2fa06e);-webkit-background-clip:text;color:transparent}.lead{font-size:18px;line-height:1.65;color:#5a7067;max-width:680px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.notes{display:flex;gap:18px;color:#667a72;font-size:13px;flex-wrap:wrap}.mock{background:#10261f;padding:12px;border-radius:28px;box-shadow:0 28px 75px rgba(10,50,36,.22)}.mockin{background:#fff;border-radius:20px;overflow:hidden}.mockhead{padding:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.wa{display:grid;grid-template-columns:1fr .92fr;min-height:460px}.chat{padding:20px;background:#f0ede6}.msg{max-width:84%;padding:11px 12px;border-radius:12px;margin:10px 0;font-size:13px;box-shadow:0 2px 5px rgba(0,0,0,.05)}.me{background:#dff9d8;margin-left:auto}.ai{background:#fff}.voice{display:flex;align-items:center;gap:8px}.play{width:28px;height:28px;border-radius:50%;background:#177d59;color:#fff;display:grid;place-items:center}.wave{flex:1;height:20px;background:repeating-linear-gradient(90deg,#7a968b 0 2px,transparent 2px 6px);opacity:.7}.extract{padding:19px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf2ef;font-size:12px}.score{margin-top:14px;padding:14px;background:#eef8f2;border-radius:14px}.score strong{font-size:28px}.section{padding:76px 5vw;max-width:1500px;margin:auto}.section h2{font-size:43px;letter-spacing:-1.5px;margin:12px 0}.section>p{color:var(--muted);max-width:760px}.grid4,.grid3{display:grid;gap:14px;margin-top:28px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px}.card h3{font-size:17px}.muted{color:var(--muted)}.flow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;background:#102b23;color:#fff;border-radius:24px;padding:22px;margin-top:28px}.step{text-align:center;padding:13px 5px;font-size:12px}.num{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.1);display:grid;place-items:center;margin:0 auto 8px;font-weight:900}.cta{margin:30px 5vw 70px;background:linear-gradient(120deg,var(--g),#18704f);color:#fff;border-radius:28px;padding:46px;display:flex;justify-content:space-between;align-items:center;gap:30px}.cta h2{font-size:38px;max-width:720px}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{position:fixed;width:235px;inset:0 auto 0 0;background:#102820;color:#d4e6de;padding:20px 14px}.side .logo{color:#fff;margin:0 8px 20px}.side .logo b{color:var(--lime)}.label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#7da193;margin:16px 10px 7px}.navitem{display:block;padding:10px 11px;border-radius:11px;margin:2px 0;font-size:13px}.navitem:hover,.navitem.on{background:#173c31;color:#fff}.main{grid-column:2;padding:0 26px 40px}.appbar{height:70px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(245,248,245,.94);backdrop-filter:blur(10px);z-index:12}.pagehead{display:flex;justify-content:space-between;align-items:end;margin:24px 0}.pagehead h1{font-size:30px;margin:0}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.kpi small{color:var(--muted)}.kpi strong{font-size:23px;display:block;margin-top:7px}.twocol{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #edf2ef}.table th{color:#73867e}.bars{display:flex;flex-direction:column;gap:10px}.hbar{display:grid;grid-template-columns:90px 1fr 55px;gap:9px;align-items:center;font-size:11px}.track{height:9px;background:#e7efea;border-radius:999px}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#27a270);border-radius:999px}.inbox{display:grid;grid-template-columns:280px 1fr 300px;height:calc(100vh - 115px);background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.conv{border-right:1px solid var(--line);overflow:auto}.person{padding:13px;border-bottom:1px solid #edf2ef}.person.active{background:#eef7f1}.chatmain{background:#f1eee8;display:flex;flex-direction:column}.chatbody{padding:18px;overflow:auto;flex:1}.chathead,.compose{background:#fff;padding:13px;border-bottom:1px solid var(--line)}.compose{display:flex;gap:8px;border-top:1px solid var(--line);border-bottom:0}.compose input{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px}.panel{padding:16px;overflow:auto}.field{margin-bottom:12px}.field small{display:block;color:var(--muted);text-transform:uppercase;font-weight:900;font-size:9px}.field b{font-size:13px}.machines,.reps,.follow{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.machine,.rep,.followcard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px}.machine.best,.rep.best{border:2px solid #198a61}.emoji{height:130px;display:grid;place-items:center;font-size:50px;background:#edf5f0;border-radius:12px}.price{font-size:22px;font-weight:900;margin:9px 0}.quote{display:grid;grid-template-columns:1fr .9fr;gap:15px}.paper{background:#fff;padding:28px;border-radius:10px;box-shadow:0 18px 55px rgba(20,45,37,.12)}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px}.kanban{display:grid;grid-template-columns:repeat(7,210px);gap:10px;overflow:auto}.col{background:#edf3ef;border-radius:13px;padding:10px;min-height:430px}.leadcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;font-size:11px}.productgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pitch{min-height:100vh;background:linear-gradient(135deg,#0c3026,#154434);color:#fff;padding:60px 7vw}.pitch h1{font-size:64px;max-width:900px;letter-spacing:-2px}.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:35px}.roadmap .card{color:var(--ink)}.toast{position:fixed;right:20px;bottom:20px;padding:12px 15px;background:#11271f;color:#fff;border-radius:11px;opacity:0;transform:translateY(12px);transition:.2s;z-index:100}.toast.show{opacity:1;transform:none}
@media(max-width:1000px){.hero{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}.grid3,.machines,.reps{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(3,1fr)}.inbox{grid-template-columns:240px 1fr}.panel{display:none}.productgrid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.navlinks{display:none}.hero{padding-top:42px}.hero h1{font-size:48px;letter-spacing:-2px}.wa{grid-template-columns:1fr}.extract{display:none}.grid4,.grid3,.machines,.reps,.follow,.twocol,.quote,.roadmap{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.cta{flex-direction:column;align-items:flex-start;padding:28px}.side{display:none}.app{display:block}.main{padding:0 13px 35px}.kpis{grid-template-columns:1fr 1fr}.inbox{grid-template-columns:1fr;height:auto}.conv{max-height:210px}.chatmain{min-height:590px}.productgrid{grid-template-columns:1fr}.pitch h1{font-size:43px}.navact .secondary{display:none}}
</style>

<div id="toast" class="toast"></div><div id="root"></div>
<script>
const root=document.getElementById('root'),S={rep:localStorage.jb_rep||'',quote:localStorage.jb_quote==='1',follow:localStorage.jb_follow==='1',moved:localStorage.jb_move==='1'};
const go=x=>location.hash=x,toast=m=>{let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
const logo=()=>'<div class="logo"><i class="mark"></i><span>Just<b>BukIt</b></span></div>';
const nav=[['overview','Overview'],['inbox','AI Inbox'],['lead','Leads'],['pipeline','Pipeline'],['quote','Quotes'],['products','Products'],['team','Team & Commission'],['automations','Automations'],['reactivation','Reactivation'],['institutional','Institutional'],['analytics','Analytics'],['knowledge','AI Knowledge']];
function shell(page,body){return '<div class="app"><aside class="side">'+logo()+'<div class="label">Sales OS</div>'+nav.slice(0,7).map(x=>'<a class="navitem '+(page===x[0]?'on':'')+'" href="#'+x[0]+'">'+x[1]+'</a>').join('')+'<div class="label">Growth</div>'+nav.slice(7).map(x=>'<a class="navitem '+(page===x[0]?'on':'')+'" href="#'+x[0]+'">'+x[1]+'</a>').join('')+'</aside><main class="main"><div class="appbar"><b>'+((nav.find(x=>x[0]===page)||[])[1]||'JustBukIt')+'</b><div><span class="pill demo">Demo Data</span> <button class="btn secondary" onclick="go(\'pitch\')">Pitch Mode</button></div></div>'+body+'</main></div>'}
function home(){return '<div><header class="nav">'+logo()+'<div class="navlinks"><a href="#home">Home</a><a href="#demo">Demo</a><a href="#pitch">Pitch mode</a></div><div class="navact"><button class="btn secondary" onclick="go(\'login\')">Sign in</button><button class="btn primary" onclick="go(\'demo\')">See live workflow</button></div></header><section class="hero"><div><span class="pill">AI SALES INFRASTRUCTURE FOR AGRICULTURAL COMMERCE</span><h1>Turn WhatsApp enquiries into <span class="grad">machinery sales.</span></h1><p class="lead">JustBukIt understands Hausa and English text or voice notes, qualifies buyers, recommends the right equipment, routes serious leads to the sales team, generates quotations and follows up until the deal moves.</p><div class="actions"><button class="btn primary" onclick="go(\'demo\')">▶ See the live workflow</button><button class="btn secondary" onclick="go(\'overview\')">Open demo dashboard →</button></div><div class="notes"><span>✓ Hausa + English</span><span>✓ WhatsApp-first</span><span>✓ Built for Nigerian equipment sales</span></div></div><div class="mock"><div class="mockin"><div class="mockhead">'+logo()+'<span class="pill hot">Hot lead · 86%</span></div><div class="wa"><div class="chat"><div class="msg me"><div class="voice"><span class="play">▶</span><span class="wave"></span><small>0:18</small></div><small>“Ina neman machine din masara wanda zai iya aiki kusan kilo 700 zuwa 1000 a awa...”</small></div><div class="msg ai">Wa alaikum salam Musa. Kana son <b>diesel ko electric</b>, kuma nawa ne budget ɗinka?</div><div class="msg me">Diesel. Budget dina kusan ₦850k zuwa ₦1.2m ne. Ina Zaria.</div><div class="msg ai">Na gane. Zan nuna maka machine ɗin da ya fi dacewa da budget da capacity ɗinka.</div></div><div class="extract"><h3>AI qualification</h3>'+[['Need','Maize sheller'],['Capacity','700–1000 kg/hr'],['Location','Zaria, Kaduna'],['Budget','₦850k–₦1.2m'],['Timeline','2 weeks'],['Power','Diesel']].map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'<div class="score"><small>Purchase intent</small><br><strong>86</strong>/100 <span class="pill hot">HOT</span></div></div></div></div></div></section><section class="section"><span class="pill">THE PROBLEM</span><h2>Most machinery sales still disappear inside WhatsApp.</h2><p>Qualification, ownership, follow-up and visibility often break between the first customer message and a completed sale.</p><div class="grid4">'+[['Too many unstructured enquiries','Texts and voice notes compete for attention.'],['Slow qualification','Reps repeat the same questions before knowing buyer intent.'],['Lost follow-ups','Quotes go cold because next actions are unclear.'],['No revenue visibility','Owners cannot clearly connect campaigns, reps and products to revenue.']].map(x=>'<div class="card"><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p></div>').join('')+'</div><div class="flow">'+['Enquiry','AI qualify','Machine match','Assign rep','Quote','Follow-up','Sale'].map((x,i)=>'<div class="step"><div class="num">'+(i+1)+'</div><b>'+x+'</b></div>').join('')+'</div></section><section class="section"><span class="pill">PLATFORM</span><h2>Not a chatbot. A vertical sales operating system.</h2><div class="grid3">'+[['Conversational AI','Hausa + English text and voice, intent detection and summaries.'],['Machinery Intelligence','Capacity, crop, budget, power and location-aware recommendations.'],['Sales Operations','Lead ownership, routing, pipelines and rep workspaces.'],['Revenue Automation','Quotes, reminders and dormant lead recovery.'],['Management Intelligence','Revenue attribution, product, rep and state analytics.'],['Growth Engine','Reactivation, institutional pipeline and demand-generation foundations.']].map(x=>'<div class="card"><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p></div>').join('')+'</div></section><div class="cta"><div><span class="pill">INTERACTIVE PROTOTYPE</span><h2>Follow one buyer from Hausa voice note to quotation.</h2><p>Click through the product as if it were already live.</p></div><button class="btn secondary" onclick="go(\'demo\')">Start Musa’s journey →</button></div></div>'}
function demo(){return '<div><header class="nav">'+logo()+'<button class="btn secondary" onclick="go(\'home\')">← Website</button></header><section class="section"><span class="pill">LIVE PRODUCT STORY</span><h2>Follow a real buyer journey.</h2><div class="grid3"><div class="card" style="background:linear-gradient(135deg,#103a2e,#166b4f);color:white"><span class="pill">RECOMMENDED DEMO</span><h2>Musa Ibrahim</h2><p>Zaria, Kaduna · Hausa · Facebook campaign</p><p>Needs a maize processing machine, 700–1000kg/hr, diesel, ₦850k–₦1.2m budget.</p><button class="btn secondary" onclick="go(\'inbox\')">Start with WhatsApp enquiry →</button></div><div class="card"><span class="pill demo">COMING NEXT</span><h2>Rabi’u Foods</h2><p class="muted">Kano · Rice mill buyer</p><button class="btn soft" onclick="toast(\'Scenario reserved for a later version\')">Preview</button></div><div class="card"><span class="pill">INSTITUTIONAL</span><h2>KMG Cooperative</h2><p class="muted">Kaduna · 4-machine request</p><button class="btn soft" onclick="go(\'institutional\')">Open view</button></div></div></section></div>'}
function login(){return '<section class="section"><div class="card" style="max-width:760px;margin:55px auto"><span class="pill">DEMO WORKSPACE</span><h2>FarmWin Machinery — Northern Sales</h2><p class="muted">A role-based workspace for the JustBukIt product demonstration.</p><div class="grid3"><button class="btn secondary" onclick="toast(\'CEO selected\')">CEO</button><button class="btn secondary" onclick="toast(\'Sales Manager selected\')">Sales Manager</button><button class="btn secondary" onclick="toast(\'Sales Rep selected\')">Sales Rep</button></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="go(\'overview\')">Enter Demo Workspace →</button></div></section>'}
function overview(){let k=[['New enquiries','286'],['Qualified','119'],['Hot leads','38'],['Quotes sent','64'],['Won revenue','₦18.4M'],['Avg response','42 sec']];return shell('overview','<div class="pagehead"><div><h1>CEO Command Center</h1><p class="muted">Northern sales operation · fictional demo data</p></div><button class="btn primary" onclick="go(\'inbox\')">Open AI Inbox</button></div><div class="kpis">'+k.map(x=>'<div class="kpi"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="twocol"><div class="card"><h3>Recent leads</h3><table class="table"><tr><th>Buyer</th><th>Need</th><th>State</th><th>Score</th></tr><tr onclick="go(\'lead\')" style="cursor:pointer"><td><b>Musa Ibrahim</b></td><td>Maize sheller</td><td>Kaduna</td><td><span class="pill hot">86</span></td></tr><tr><td>Amina Yusuf</td><td>Feed mixer</td><td>Kano</td><td>78</td></tr><tr><td>Sani Garba</td><td>Rice mill</td><td>Katsina</td><td>73</td></tr></table></div><div class="card"><h3>Needs attention</h3><div class="row"><span>Hot leads not contacted</span><b>6</b></div><div class="row"><span>Quotes expiring</span><b>3</b></div><div class="row"><span>Dormant high-value leads</span><b>8</b></div><button class="btn soft" onclick="go(\'reactivation\')">Review opportunities →</button></div></div><div class="twocol"><div class="card"><h3>Sales by state</h3><div class="bars">'+[['Kano',88,'₦5.8M'],['Kaduna',74,'₦4.9M'],['Katsina',53,'₦3.5M'],['Bauchi',42,'₦2.8M']].map(x=>'<div class="hbar"><span>'+x[0]+'</span><div class="track"><i style="width:'+x[1]+'%"></i></div><b>'+x[2]+'</b></div>').join('')+'</div></div><div class="card"><h3>AI contribution</h3><h2 style="font-size:44px">71%</h2><p class="muted">of first responses handled by AI before human escalation.</p></div></div>')}
function inbox(){return shell('inbox','<div class="pagehead"><div><h1>AI Inbox</h1><p class="muted">One customer number. Structured conversations. Clear ownership.</p></div></div><div class="inbox"><div class="conv"><div class="person active"><b>Musa Ibrahim</b><br><small class="muted">🎤 Hausa voice note · 2m</small></div><div class="person"><b>Amina Yusuf</b><br><small class="muted">Feed mixer price · 6m</small></div><div class="person"><b>Sani Garba</b><br><small class="muted">Delivery to Funtua? · 9m</small></div><div class="person"><b>KMG Cooperative</b><br><small class="muted">Institutional request · 18m</small></div></div><div class="chatmain"><div class="chathead"><b>Musa Ibrahim</b> <span class="pill hot">AI qualifying</span><br><small class="muted">Zaria · Hausa detected · Facebook / Maize Campaign</small></div><div class="chatbody"><div class="msg me"><div class="voice"><span class="play">▶</span><span class="wave"></span><small>0:18</small></div><small>Transcript: “Ina neman machine din masara wanda zai iya aiki kusan kilo 700 zuwa 1000 a awa...”</small></div><div class="msg ai">Wa alaikum salam Musa. Kana son diesel ko electric?</div><div class="msg me">Diesel.</div><div class="msg ai">Nawa ne budget ɗinka kuma ina za a kai machine ɗin?</div><div class="msg me">₦850k zuwa ₦1.2m. Ina Zaria, Kaduna.</div><div class="msg ai">Kana son saya nan da sati biyu ko kana bincike ne?</div><div class="msg me">Cikin sati biyu.</div></div><div class="compose"><input placeholder="Type a reply…"/><button class="btn primary" onclick="toast(\'Demo reply sent\')">Send</button></div></div><div class="panel"><span class="pill">AI EXTRACTED</span><h3>Buyer profile</h3>'+[['Language','Hausa'],['Need','Maize sheller'],['Capacity','700–1000 kg/hr'],['Location','Zaria, Kaduna'],['Budget','₦850k–₦1.2m'],['Timeline','Within 2 weeks'],['Power','Diesel']].map(x=>'<div class="field"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'<div class="score"><strong>86/100</strong> <span class="pill hot">HOT</span></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="go(\'lead\')">View Qualified Lead →</button></div></div>')}
